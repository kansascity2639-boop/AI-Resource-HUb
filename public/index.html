<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI AP Hub</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  display: flex;
  height: 100vh;
  background: #0f172a;
  color: white;
}

.sidebar {
  width: 250px;
  background: #1e293b;
  padding: 10px;
}

.sidebar button {
  width: 100%;
  margin: 5px 0;
  padding: 10px;
  background: #334155;
  border: none;
  color: white;
  cursor: pointer;
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.chat {
  flex: 1;
  padding: 10px;
  overflow-y: auto;
}

.inputArea {
  display: flex;
  padding: 10px;
  background: #1e293b;
}

input {
  flex: 1;
  padding: 10px;
}

button {
  padding: 10px;
  background: #3b82f6;
  border: none;
  color: white;
}
</style>
</head>

<body>

<div class="sidebar">
  <button onclick="setCourse('AP Calculus BC')">Calc BC</button>
  <button onclick="setCourse('AP Physics')">Physics</button>
  <button onclick="setCourse('AP Chemistry')">Chemistry</button>
  <button onclick="setCourse('AP US History')">USH</button>
</div>

<div class="main">

  <div class="chat" id="chat"></div>

  <div class="inputArea">
    <input id="input" placeholder="Ask a question..." />
    <button onclick="send()">Send</button>
  </div>

</div>

<script>
let course = "General";

function setCourse(c) {
  course = c;
  add("System", "Switched to " + c);
}

function add(sender, text) {
  const chat = document.getElementById("chat");
  chat.innerHTML += `<p><b>${sender}:</b> ${text}</p>`;
  chat.scrollTop = chat.scrollHeight;
}

async function send() {
  const input = document.getElementById("input");
  const msg = input.value;
  input.value = "";

  add("You", msg);

  const res = await fetch("/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: msg, course })
  });

  const data = await res.json();

  // 🔥 FIX: use "reply", not full object
  add("AI", data.reply);
}
</script>

</body>
</html>
